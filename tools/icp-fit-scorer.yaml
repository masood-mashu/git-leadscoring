name: icp-fit-scorer
version: 1.0.0
description: "Evaluates enterprise company size and revenue against Ideal Customer Profile tiers"
input_schema:
  type: object
  properties:
    firmographics_json:
      type: string
      description: "JSON with employee_count and annual_revenue_usd"
  required:
    - firmographics_json
implementation:
  type: script
  path: icp_fit_scorer.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
